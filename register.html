
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | FAM Pharma Turkey</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="customer.css">
    <script src="customer.js" defer></script>
</head>
<body>
    <header class="customer-header">
        <a href="index.html" class="customer-logo">
            <img src="fam_logo.png"
                 alt="FAM Pharma Turkey">
        </a>
        <a href="index.html" class="customer-back">
            ← Mağazaya Dön
        </a>
    </header>

    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="auth-heading">
                <span class="auth-label">FAM PHARMA TURKEY</span>
                <h1>Hesap Oluştur</h1>
                <p>Müşteri kayıt formu</p>
            </div>

            <form id="registerForm" class="auth-form">
                <label for="fullName">Ad Soyad</label>
                <input id="fullName"
                       autocomplete="name"
                       maxlength="150"
                       placeholder="Adınız ve soyadınız" required>

                <label for="registerEmail">E-posta Adresi</label>
                <input type="email" id="registerEmail"
                       autocomplete="email"
                       placeholder="ornek@mail.com" required>

                <label for="registerPhone">Telefon Numarası</label>
                <input type="tel" id="registerPhone"
                       autocomplete="tel"
                       placeholder="05XX XXX XX XX">

                <label for="registerPassword">Şifre</label>
                <div class="password-field">
                    <input type="password"
                           id="registerPassword"
                           autocomplete="new-password"
                           minlength="8"
                           placeholder="En az 8 karakter" required>
                    <button type="button"
                            data-password-toggle="registerPassword">
                        Göster
                    </button>
                </div>

                <label for="confirmPassword">Şifre Tekrar</label>
                <input type="password"
                       id="confirmPassword"
                       autocomplete="new-password"
                       minlength="8"
                       placeholder="Şifrenizi tekrar girin" required>

                <button type="submit" class="auth-submit">
                    Kayıt Ol
                </button>
            </form>

            <p id="authMessage" class="auth-message"
               role="status" aria-live="polite"></p>

            <div class="auth-footer">
                Zaten hesabınız var mı?
                <a href="login.html">Giriş Yapın</a>
            </div>
        </section>
    </main>
</body>
</html>
