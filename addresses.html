
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Adreslerim | FAM Pharma Turkey</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="customer.css">
    <link rel="stylesheet" href="shopping.css">
    <link rel="stylesheet" href="assistant.css">

    <script src="products-data.js" defer></script>
    <script src="cart-store.js" defer></script>
    <script src="shopping.js" defer></script>
    <script src="assistant.js" defer></script>
</head>
<body>

<header class="customer-header">
    <a href="index.html" class="customer-logo">
        <img src="fam_logo.png" alt="FAM Pharma Turkey">
    </a>
    <nav class="customer-links">
        <a href="index.html">Ana Sayfa</a>
        <a href="cart.html">Sepetim</a>
        <a href="profile.html">Hesabım</a>
    </nav>
</header>

<main class="customer-main">
    <div class="customer-container">

        <div class="customer-page-heading">
            <span class="auth-label">HESABIM</span>
            <h1>Adreslerim</h1>
            <p>Teslimat adreslerinizi yönetin.</p>
        </div>

        <div class="shopping-two-columns">

            <section class="shopping-panel">
                <h2>Yeni Adres Ekle</h2>

                <form id="addressForm" class="shopping-form">

                    <label for="addressTitle">Adres Başlığı</label>
                    <input id="addressTitle" required
                           maxlength="60" placeholder="Ev, İş...">

                    <label for="recipientName">Ad Soyad</label>
                    <input id="recipientName" required
                           maxlength="150">

                    <label for="recipientPhone">Telefon</label>
                    <input id="recipientPhone" type="tel"
                           required maxlength="20"
                           placeholder="05XX XXX XX XX">

                    <div class="shopping-form-grid">
                        <div>
                            <label for="province">İl</label>
                            <select id="province" required disabled>
                                <option value="">İller yükleniyor...</option>
                            </select>
                        </div>

                        <div>
                            <label for="district">İlçe</label>
                            <select id="district" required disabled>
                                <option value="">Önce il seçiniz</option>
                            </select>
                        </div>
                    </div>

                    <label for="postalCode">Posta Kodu</label>
                    <input id="postalCode" maxlength="5"
                           inputmode="numeric"
                           pattern="[0-9]{5}"
                           placeholder="Örn: 27000">

                    <label for="addressLine">Açık Adres</label>
                    <textarea id="addressLine" rows="4"
                              maxlength="1000" required
                              placeholder="Mahalle, cadde, sokak, bina ve daire..."></textarea>

                    <label class="shopping-inline-check">
                        <input type="checkbox" id="defaultAddress">
                        Varsayılan adresim olsun
                    </label>

                    <button class="auth-submit" type="submit">
                        Adresi Kaydet
                    </button>
                </form>

                <p id="addressMessage"
                   class="summary-note"
                   role="status"></p>
            </section>

            <section class="shopping-panel">
                <h2>Kayıtlı Adreslerim</h2>
                <div id="addressList"></div>
            </section>

        </div>

    </div>
</main>

</body>
</html>
