
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum | FAM Pharma Turkey</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="customer.css">

    <script src="password-reset.js" defer></script>
</head>
<body>

<header class="customer-header">
    <a href="index.html" class="customer-logo">
        <img src="fam_logo.png" alt="FAM Pharma Turkey">
    </a>

    <a href="login.html" class="customer-back">
        ← Giriş Sayfasına Dön
    </a>
</header>

<main class="auth-wrapper">
    <section class="auth-card">

        <div class="auth-heading">
            <span class="auth-label">HESAP KURTARMA</span>
            <h1>Şifremi Unuttum</h1>
            <p>Hesabınızla ilişkili iletişim bilgilerini girin.</p>
        </div>

        <form id="resetRequestForm" class="auth-form">

            <label for="resetEmail">E-posta Adresi</label>
            <input type="email" id="resetEmail"
                   autocomplete="email"
                   placeholder="ornek@mail.com" required>

            <label for="resetPhone">Telefon Numarası</label>
            <input type="tel" id="resetPhone"
                   autocomplete="tel"
                   placeholder="05XX XXX XX XX"
                   maxlength="20" required>

            <button type="submit" class="auth-submit">
                Sıfırlama Bağlantısı İste
            </button>

        </form>

        <p id="resetMessage"
           class="auth-message"
           role="status"></p>
    </section>
</main>

</body>
</html>
